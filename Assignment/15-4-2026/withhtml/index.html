<!DOCTYPE html>
<html>
<head>
    <title>Simple Arithmetic Calculator</title>
</head>
<body>

    <h2>Simple Arithmetic Calculator</h2>

    <label>Enter First Number:</label>
    <input type="number" id="num1"><br><br>

    <label>Enter Second Number:</label>
    <input type="number" id="num2"><br><br>

    <button type="button" onclick="add()">Addition</button>
    <button type="button" onclick="subtract()">Subtraction</button>
    <button type="button" onclick="multiply()">Multiplication</button>
    <button type="button" onclick="divide()">Division</button>

    <h3 id="result"></h3>

    <!-- Linking JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
